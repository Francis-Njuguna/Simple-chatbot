  vas: VAS
  mfa: MFA
  2fa: 2FA
  sis: SIS
  smowl: SMOWL
  m365: M365
  amiu: AmIU
  it: IT
  ms: MS
  pdf: PDF
  otp: OTP

# ---------------------------------------------------------------------------
# SPELL CORRECTIONS — observed (and next-most-likely) misspellings.
#
# These exist because fuzzy matching cannot reach them safely: "smwol" is a
# transposition at SequenceMatcher ratio 0.80 and "moddle" one edit at 0.83,
# both below any threshold loose enough not to mangle ordinary words. An
# explicit map is both safer and faster than lowering the fuzzy bar.
# ---------------------------------------------------------------------------
