# Amref Help Desk — domain knowledge for retrieval.
#
# WHAT THIS FILE IS FOR
# ---------------------
# Retrieval quality for this knowledge base rests on facts no embedding model
# knows: that "LMS" and "Moodle" name one system *here*, that "SMOWL" is the
# proctoring tool, that a user typing "smwol" meant it. Those facts change as
# the KB grows and are maintained by whoever runs the help desk — so they live
# here, not in Python.
#
# Edit this file and restart (or POST /api/admin/reload-domain-knowledge) — no
# code change, no redeploy of the retrieval logic.
#
# EVERY SECTION IS OPTIONAL. Whatever you omit falls back to the built-in
# defaults in backend/app/rag/domain_knowledge.py, so deleting this file leaves
# the system working exactly as it did before it existed.
#
# HOW MERGING WORKS
#   synonyms          — merged by group id. A group id present here REPLACES the
#                       built-in group of that id; a new id is added.
#   abbreviations     — merged key by key (this file wins).
#   acronyms          — merged key by key (this file wins).
#   spell_corrections — merged key by key (this file wins).
#   intents           — merged by intent name (this file wins).

version: 1

# ---------------------------------------------------------------------------
# SYNONYM GROUPS — also the entity dictionary
# ---------------------------------------------------------------------------
# A group is a set of surface forms that mean ONE thing in this KB. It does
# double duty:
#
#   * synonym expansion — every term is appended to the BM25 query, so "LMS
#     login" reaches a chunk whose title only says "Moodle".
#   * entity extraction — matching any term means the query is ABOUT this
#     entity, reported as `canonical`. This is what makes "moddle", "lms",
#     "learning portal" and "course portal" all resolve to "Moodle LMS".
#
# Fields
#   canonical : the entity's display name. Reported in traces and metrics.
#               NOT used for query rewriting — see `terms` below.
#   kind      : system | action | object. Only `system` groups are treated as
#               entities strong enough to steer intent boosting.
#   terms     : all surface forms. ORDER MATTERS: terms[0] is the form used
#               when rewriting a query variant ("lms login" -> "LMS login").
#               It is deliberately the KB's own preferred wording, which is
#               often shorter than `canonical`. Reordering this list changes
#               measured recall — see the variant-order note in retriever.py.

synonyms:
  lms:
    canonical: Moodle LMS
    kind: system
    terms:
      - LMS
      - Moodle
      - Learning Management System
      - learning platform
      - e-learning
      - learning portal
      - course portal

  student_portal:
    canonical: Student Portal
    kind: system
    terms:
      - Student Portal
      - portal
      - SIS
      - student information system
      - student system
      - portal login
      - student account

  mfa:
    canonical: Microsoft Authenticator
    kind: system
    terms:
      - MFA
      - Microsoft Authenticator
      - authenticator
      - 2FA
      - two-factor authentication
      - multi-factor authentication
      - multifactor authentication
      - authenticator app
      - verification app

  email:
    canonical: University Email
    kind: system
    terms:
      - student email
      - university email
      - corporate email
      - Outlook
      - Microsoft 365 email
      - M365 email
      - Office 365 email
      - official email
      - mcampus email
      - campus email

  vas:
    canonical: Virtual Assessment System
    kind: system
    terms:
      - VAS
      - Virtual Assessment System
      - assessment platform
      - assessment system
      - exam system
      - online exam
      - online examination

  smowl:
    canonical: SMOWL Proctoring
    kind: system
    terms:
      - SMOWL
      - proctoring
      - online exam monitoring
      - screen monitoring
      - proctoring software
      - exam monitoring
      - proctored exam
      - remote proctoring
      - exam supervision
      - camera monitoring

  teams:
    canonical: Microsoft Teams
    kind: system
    terms:
      - Microsoft Teams
      - Teams
      - MS Teams

  myloft:
    canonical: My Loft
    kind: system
    terms:
      - My Loft
      - MyLoft
      - library resources
      - digital library

  helpdesk:
    canonical: Help Desk
    kind: system
    terms:
      - help desk
      - helpdesk
      - support
      - IT support
      - technical support

  # --- actions and objects -------------------------------------------------
  # These carry no entity weight on their own (a query about "login" is not
  # about a system), but they are what makes paraphrase collapse work.

  login:
    canonical: Login
    kind: action
    terms: [login, log in, sign in, signin, log on, logon, access]

  password:
    canonical: Password
    kind: object
    terms: [password, passcode, login credentials, credentials]

  reset:
    canonical: Reset
    kind: action
    terms: [reset, recover, change, retrieve, forgot]

  register:
    canonical: Registration
    kind: action
    terms: [register, registration, enroll, enrolment, enrollment, sign up]

  exam:
    canonical: Exam
    kind: object
    terms: [exam, examination, test, assessment]

  supplementary_exam:
    canonical: Supplementary Exam
    kind: object
    terms: [supplementary exam, special exam, resit, retake]

  camera:
    canonical: Camera
    kind: object
    terms: [camera, webcam, cam, video]

  grades:
    canonical: Grades
    kind: object
    terms: [grades, marks, results, scores, transcript]

  setup:
    canonical: Setup
    kind: action
    terms: [setup, set up, configure, install, installation]

# ---------------------------------------------------------------------------
