# ---------------------------------------------------------------------------
# INTENTS
# ---------------------------------------------------------------------------
# An intent is what the user is trying to DO, independent of wording. It drives
# three things:
#
#   phrasings  — canonical rewrites added as retrieval variants. This is what
#                collapses "can't login" / "unable to access" / "where do I
#                sign in" onto one retrieval: all three match one pattern and
#                inherit the same phrasings.
#   boost      — terms that, when present in a candidate chunk, nudge it UP the
#                final ordering. A BOOST, never a filter: a chunk with none of
#                these is ranked lower, not removed. Keep lists short and
#                specific — a boost term that appears in half the corpus is
#                noise, not signal.
#   procedural — true when the answer is a multi-step walkthrough. Procedural
#                intents get a larger adaptive top_k so the steps survive
#                intact; factual ones get a smaller one so the model is not
#                handed four near-duplicate excerpts to reconcile.
#
# `patterns` are Python regexes matched case-insensitively against the
# NORMALISED query (lowercased, punctuation stripped, spelling corrected), so
# write them against clean text.

intents:
  password_reset:
    patterns:
      - '\b(forgot|lost|forgotten|don''?t remember|cannot remember)\b.*\b(password|pwd|passcode)\b'
      - '\b(password|pwd)\b.*\b(forgot|lost|reset|recover|change)\b'
    phrasings:
      - How do I reset my password?
      - password reset steps
      - recover forgotten password
    boost: [password, reset, credentials, authentication, portal, recover, login]
    procedural: true

  login_trouble:
    patterns:
      - '\b(can''?t|cannot|unable to|couldn''?t|failed to|having (trouble|issues?|problems?))\b.*\b(log ?in|log ?on|sign ?in|access|get in|enter)\b'
      - '\b(login|log ?in|sign ?in)\b.*\b(problem|issue|error|trouble|fail(ed|ure)?|not working)\b'
      - '\b(account)\b.*\b(locked|lock|blocked|disabled)\b'
    phrasings:
      - How do I log in?
      - login troubleshooting
      - cannot sign in to my account
    boost: [login, sign in, access, password, portal, account, credentials]
    procedural: true

  login_location:
    patterns:
      - '\bwhere\b.*\b(do|can|should)\b.*\b(i|we)\b.*\b(log ?in|sign ?in|access|find)\b'
    phrasings:
      - How do I log in?
      - where to sign in
      - login page location
    boost: [login, sign in, url, address, portal, access]
    procedural: false

  setup_howto:
    patterns:
      - '\b(how|steps?|guide|instructions?|procedure|process)\b.*\b(set ?up|setup|configure|install)\b'
    phrasings:
      - setup instructions
      - configuration steps
      - how to set up
    boost: [setup, configure, install, steps, download, enrol]
    procedural: true

  camera_issue:
    patterns:
      - '\b(camera|webcam|cam|microphone|mic)\b.*\b(not working|fail(ed|ing)?|issue|problem|error|black|blank)\b'
      - '\b(not working|problem|issue)\b.*\b(camera|webcam|cam)\b'
    phrasings:
      - camera not working during exam
      - webcam troubleshooting
      - fix camera detection
    boost: [camera, webcam, SMOWL, proctoring, permissions, browser, exam]
    procedural: true

  definition:
    patterns:
      - '\b(what is|what''?s|explain|describe|tell me about|meaning of)\b'
    phrasings:
      - overview and explanation
      - what it is and how it works
    boost: []
    procedural: false

  exam_registration:
    patterns:
      - '\b(register|registration|enroll|sign ?up)\b.*\b(exam|examination|test|assessment|course|unit)\b'
      - '\b(exam|examination)\b.*\b(register|registration|enroll)\b'
    phrasings:
      - How do I register for exams?
      - exam registration process
    boost: [exam, registration, register, VAS, assessment, deadline]
    procedural: true

  exam_proctoring:
    patterns:
      - '\b(smowl|proctor(ing|ed)?|monitor(ing|ed)?|supervis(ion|ed))\b'
    phrasings:
      - How does exam proctoring work?
      - SMOWL proctoring overview
    boost: [SMOWL, proctoring, exam, assessment, camera, monitoring]
    procedural: false

  email_access:
    patterns:
      - '\b(email|e-mail|mailbox|outlook|office ?365|microsoft ?365|m365)\b'
    phrasings:
      - How do I access my student email?
      - university email login
    boost: [email, Outlook, Microsoft 365, mailbox, webmail, password]
    procedural: false

  contact_support:
    patterns:
      - '\b(contact|reach|call|speak to|talk to|get help from)\b.*\b(help ?desk|support|IT|admin|administrator|staff)\b'
    phrasings:
      - How do I contact the help desk?
      - support contact details
    boost: [help desk, support, contact, email, phone, ticket]
    procedural: false
