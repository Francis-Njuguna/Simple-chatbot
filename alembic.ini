# Alembic configuration.
#
# The database URL is NOT stored here — env.py pulls it from
# backend.app.config.Settings.sync_database_url so that Alembic, the FastAPI
# app and the ingestion scripts all resolve credentials through exactly one
# code path (see the Settings docstring for the precedence rules).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped, slug-based revision filenames keep the versions/ directory
# readable in review (e.g. 20260801_1200-a1b2c3d4e5f6_add_summary.py).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
